[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-ai-operations-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2", "argon2-cffi>=25.1,<26", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]

[project.optional-dependencies]
test = ["ruff>=0.14,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
